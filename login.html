<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập | Bloomora</title>

  <!-- Google Fonts Chuẩn Tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; }
    .font-serif-title { font-family: 'Playfair Display', Georgia, serif; }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose: {
              50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3',
              500: '#f43f5e', 600: '#e11d48', 700: '#be123c', 800: '#9f1239', 900: '#881337',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-gradient-to-br from-rose-50/70 via-stone-50 to-stone-100 text-stone-800 antialiased min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- THANH QUAY LẠI TRANG CHỦ -->
  <div class="max-w-md w-full mx-auto flex items-center justify-between pb-4">
    <a href="index.html" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-stone-600 hover:text-rose-600 bg-white/80 hover:bg-white px-3 py-1.5 rounded-full border border-stone-200 shadow-sm transition">
      <i class="ph ph-arrow-left text-sm"></i>
      <span>Về trang chủ</span>
    </a>
    <div class="flex items-center space-x-1 text-xs text-stone-500">
      <i class="ph ph-shield-check text-emerald-600 text-base"></i>
      <span>Bảo mật an toàn</span>
    </div>
  </div>

  <!-- KHỐI FORM ĐĂNG NHẬP -->
  <main class="max-w-md w-full mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-stone-200 shadow-2xl shadow-rose-950/5">
    
    <!-- Logo & Tiêu đề -->
    <div class="text-center mb-6">
      <a href="index.html" class="inline-flex items-center justify-center space-x-2 group">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-700 to-rose-500 flex items-center justify-center text-white shadow-md shadow-rose-600/30">
          <i class="ph ph-flower-lotus text-2xl"></i>
        </div>
        <span class="font-serif-title text-2xl font-bold tracking-tight text-stone-900 group-hover:text-rose-600 transition">BLOOMORA</span>
      </a>
      <h1 class="text-base font-bold text-stone-900 mt-3">Đăng Nhập Tài Khoản</h1>
      <p class="text-xs text-stone-400 mt-1 font-medium">Chào mừng bạn quay trở lại với tiệm hoa tươi Bloomora</p>
    </div>

    <!-- Form -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Email hoặc Số điện thoại:</label>
        <div class="relative">
          <input 
            type="text" 
            id="loginIdentifier"
            required
            placeholder="nhapemail@example.com hoặc 0912..."
            class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-10 pr-4 py-2.5 text-xs text-stone-800 font-medium focus:bg-white focus:border-rose-500 focus:ring-2 focus:ring-rose-200 focus:outline-none transition"
          >
          <i class="ph ph-user text-stone-400 absolute left-3.5 top-3 text-base"></i>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-semibold text-stone-700">Mật khẩu:</label>
          <a href="forgot-password.html" class="text-[11px] font-semibold text-rose-600 hover:text-rose-700 hover:underline transition">
            Quên mật khẩu?
          </a>
        </div>
        <div class="relative">
          <input 
            type="password" 
            id="loginPassword"
            required
            placeholder="Nhập mật khẩu của bạn"
            class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-10 pr-10 py-2.5 text-xs text-stone-800 font-medium focus:bg-white focus:border-rose-500 focus:ring-2 focus:ring-rose-200 focus:outline-none transition"
          >
          <i class="ph ph-lock-key text-stone-400 absolute left-3.5 top-3 text-base"></i>
          <button 
            type="button" 
            onclick="togglePassword('loginPassword', this)"
            class="absolute right-3.5 top-2.5 text-stone-400 hover:text-stone-600 text-base"
          >
            <i class="ph ph-eye"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-stone-500">
        <label class="flex items-center space-x-2 cursor-pointer select-none">
          <input type="checkbox" checked class="w-4 h-4 text-rose-600 rounded border-stone-300 focus:ring-rose-500">
          <span>Ghi nhớ phiên đăng nhập</span>
        </label>
      </div>

      <button 
        type="submit" 
        class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs py-3 rounded-xl shadow-md shadow-rose-600/30 transition flex items-center justify-center space-x-1.5"
      >
        <i class="ph ph-sign-in text-base"></i>
        <span>Đăng Nhập Ngay</span>
      </button>

      <!-- Đăng nhập mạng xã hội -->
      <div class="relative my-4 text-center">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-stone-200"></div></div>
        <span class="relative bg-white px-3 text-[11px] text-stone-400 uppercase font-semibold">Hoặc</span>
      </div>

      <div class="grid grid-cols-2 gap-3 text-xs font-semibold">
        <button type="button" onclick="alert('Đăng nhập Google thành công!')" class="flex items-center justify-center space-x-2 py-2.5 px-3 border border-stone-200 rounded-xl hover:bg-stone-50 transition">
          <i class="ph ph-google-logo text-rose-600 text-base"></i>
          <span>Google</span>
        </button>
        <button type="button" onclick="alert('Đăng nhập Facebook thành công!')" class="flex items-center justify-center space-x-2 py-2.5 px-3 border border-stone-200 rounded-xl hover:bg-stone-50 transition">
          <i class="ph ph-facebook-logo text-blue-600 text-base"></i>
          <span>Facebook</span>
        </button>
      </div>

      <!-- Liên kết sang Đăng ký -->
      <p class="text-center text-xs text-stone-500 pt-2">
        Chưa có tài khoản? 
        <a href="register.html" class="text-rose-600 font-bold hover:underline">Đăng ký thành viên mới</a>
      </p>
    </form>

  </main>

  <footer class="text-center text-[11px] text-stone-400 py-4">
    Bloomora Floral E-Commerce &copy; 2026. Mọi quyền được bảo lưu.
  </footer>

  <script>
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ph ph-eye-slash text-rose-600';
      } else {
        input.type = 'password';
        icon.className = 'ph ph-eye text-stone-400';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginIdentifier').value;
      alert(`Đăng nhập thành công với tài khoản: ${user}!`);
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
